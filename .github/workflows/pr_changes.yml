name: Summarize bang changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bang-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute code from the PR in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Fetch PR snapshots and generate summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          git cat-file -e "$HEAD_SHA^{commit}"
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          ruby scripts/generate_pr_comment.rb "$MERGE_BASE" "$HEAD_SHA" "$RUNNER_TEMP/bang-changes.md"

      - name: Create or update summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/bang-changes.md`, 'utf8');
            const params = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.startsWith('<!-- bang-changes -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({...params, body});
            }
